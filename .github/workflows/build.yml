name: Build APK Android

on:
  push:
    branches: [ principal, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build APK signé

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Décoder le Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Compiler l'APK signé avec Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: stable
          command: buildozer android release
          keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} # si même mdp que keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MathQuizComores-APK
          path: bin/*.apk
