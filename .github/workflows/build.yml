name: Build APK Math Quiz Comores

on:
  push:
    branches: [ principal, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      - name: 2. Décoder le Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          ls -l keystore.jks

      - name: 3. Vérifier buildozer.spec
        run: cat buildozer.spec

      - name: 4. Compilation APK Release avec Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: stable
          command: buildozer android release -v
          keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: 5. Lister les APK générés
        run: ls -R bin/

      - name: 6. Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MathQuizComores-v${{ github.run_number }}
          path: bin/*.apk
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MathQuizComores-APK
          path: bin/*.apk
