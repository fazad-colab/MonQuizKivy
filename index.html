<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Quiz Comores - KaTeX Local</title>

  <!-- Fichiers locaux -->
  <link rel="stylesheet" href="katex/katex.min.css">
  <script src="katex/katex.min.js"></script>
  <script src="katex/contrib/auto-render.min.js"></script>

  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #e0e0e0; }
    .chambre { background: #1e1e1e; padding: 15px; margin: 15px 0; border-radius: 8px; border: 1px solid #333; }
    ul { padding-left: 20px; }
  </style>
</head>
<body>

  <h2>Math Quiz Comores</h2>

  <div class="chambre">
    <h3>Énoncé :</h3>
    <div id="enonce"><!--_ENONCE_--></div>
  </div>

  <div class="chambre">
    <h3>Options :</h3>
    <ul id="opts"><!--_OPTS_--></ul>
  </div>

  <div class="chambre">
    <h3>Correction :</h3>
    <div id="correct"><!--_CORRECT_--></div>
  </div>

  <div class="chambre">
    <h3>Explication :</h3>
    <div id="exp"><!--_EXP_--></div>
  </div>

  <script>
  function renderMath() {
    if (typeof renderMathInElement === "function") {
      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderMath);
  } else {
    renderMath();
  }
</script>
